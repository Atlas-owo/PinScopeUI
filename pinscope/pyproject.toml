[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinscope"
version = "0.1.0"
description = "PinScope Control Panel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "pyqtgraph>=0.13.3",
    "numpy>=1.26.0",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88
